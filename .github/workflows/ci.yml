name: ci
on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Deliberately no eval run here — every suite spends real OpenRouter
      # credits, and this repo has no image to build/publish. CI's job is
      # "does it typecheck," not "does it pass the matrix."
